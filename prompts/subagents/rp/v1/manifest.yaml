version: "1.10.0"
released_at: "2026-09-11"
agent_code: "RP"

prompt_files:
  - "scenarios/01_rp_documents.md"
  - "scenarios/02_apartment_management_fee_rp_eligibility.md"
  - "scenarios/03_composite_conversion.md"
  - "scenarios/04_fixed_guidance.md"
  # 모든 세부 설명을 읽은 뒤 최종 판정 규칙을 가장 가까이 적용하도록
  # system.md를 마지막에 결합한다.
  - "system.md"

model:
  temperature: 0

# RP는 detail별 oneOf/discriminator 스키마를 사용하면
# 일부 GenOS 모델이 특정 분기를 반복 선택할 수 있다. RP에만 단순 enum 기반
# 구조화 출력을 적용하고, 선택 후 router가 해당 detail 파라미터만 사용한다.
structured_output:
  mode: "flat"

parameter_definitions:
  rag_query:
    description: "마스터 보정 질문에서 RP 문서 조회 요청만 분리해 만든 독립적인 Databricks 검색 질문. 원래 의미를 유지하고 새로운 조건을 추가하지 않음"
  keywords:
    value_type: "string_list"
    min_items: 1
    max_items: 10
    description: "선택한 RP 문서 세부 시나리오의 Databricks 하이브리드 검색에 사용할 핵심 업무 키워드 배열. 실제 조회형 세부 시나리오에는 사용하지 않음"
  address:
    description: "APARTMENT_RP_LIST의 실제 단지 검색값. 질문에 명시된 아파트명·단지명 또는 서울시 강남구 테헤란로·수원시 영통동처럼 시/도/군/구/읍/면/동/로/길이 포함된 전체·부분 주소를 그대로 추출한다. 질문 전체가 구체적인 주소·아파트명·단지명이면 조회 동사 없이도 전체 값을 추출한다. '아파트', '아파트 관리비', '자동이체', '자동납부', '주소', '지역' 같은 일반 업무명만 있으면 검색값이 아니므로 null"
  closing_year_month:
    description: "마감작업년월. 반드시 YYYYMM 형식이며 질문에 없으면 null"
    pattern: "^[0-9]{6}$"
  reference_date:
    description: "기준일자. 반드시 YYYYMMDD 형식이며 질문에 없으면 null"
    pattern: "^[0-9]{8}$"

scenarios:
  - code: "RP_DOCUMENTS"
    name: "RP 업무 문서 조회"
    description: "환산점수·실적 데이터 조회가 아닌 RP 서비스별 신청 방법, 처리 절차, 변경, 해지, 이용 기준, 제한사항 및 운영 정책을 문서에서 조회"
    details:
      - code: "APARTMENT_MANAGEMENT_FEE_AUTOPAY_GUIDE"
        name: "아파트 관리비 자동납부 기준 및 절차 안내"
        description: "아파트명·지역명으로 실제 연결 가능 단지를 검색하는 요청이 아닌 일반 문의. 아파트 관리비 자동납부의 일반 신청 절차·변경·해지·타기관 자동이체 전환 기준·조건·제한을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "아파트 관리비 자동납부 신청 방법을 알려줘"
          - "아파트 관리비 자동납부 해지 절차를 알려줘"
          - "아파트 관리비 자동납부 제한 기준을 알려줘"

      - code: "CITY_GAS_AUTOPAY_GUIDE"
        name: "도시가스 요금 자동납부 기준 및 절차 안내"
        description: "도시가스·가스요금 자동납부의 일반 신청 절차·변경·해지·타기관 자동이체 전환 기준·공급지역·명의·용도 조건을 문서에서 조회. 복합환산 점수나 실적 조회가 아님"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "도시가스 요금 자동납부 신청 방법을 알려줘"
          - "도시가스 자동납부가 가능한지 알려줘"

      - code: "SOCIAL_INSURANCE_AUTOPAY_GUIDE"
        name: "4대 사회보험 자동납부 기준 및 절차 안내"
        description: "국민연금·건강보험·고용보험·산재보험 자동납부의 일반 신청 절차·변경·해지·타기관 자동이체 전환 기준·가입자별 가능 항목을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "4대 사회보험 자동납부 신청 방법을 알려줘"
          - "사회보험료 카드 자동납부 기준을 알려줘"

      - code: "ELECTRICITY_TV_FEE_AUTOPAY_GUIDE"
        name: "전기요금 및 TV수신료 자동납부 기준 및 절차 안내"
        description: "한국전력 전기요금·TV수신료 자동납부의 일반 신청 절차·변경·해지·타기관 자동이체 전환 기준·용도별 조건을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "전기요금 자동납부 신청 방법을 알려줘"
          - "TV수신료 자동납부 기준을 알려줘"

      - code: "SAMSUNG_POSTPAID_HIPASS_CARD_GUIDE"
        name: "삼성 후불하이패스 카드 기준 및 절차 안내"
        description: "삼성 후불하이패스 카드의 신청·발급·이용 방법·변경·해지·제한 기준을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "삼성 후불하이패스 카드 신청 기준을 알려줘"
          - "후불하이패스 카드 이용 방법을 알려줘"

      - code: "PAYMENT_NOTIFICATION_SERVICE_GUIDE"
        name: "바로알림 및 휴대폰 알림서비스 기준 및 절차 안내"
        description: "바로알림서비스·휴대폰 알림서비스의 신청·이용·변경·해지·요금·제한 기준을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "바로알림서비스 신청 방법을 알려줘"
          - "휴대폰 알림서비스 이용 기준을 알려줘"

      - code: "PAYMENT_DATE_CREDIT_PERIOD_GUIDE"
        name: "결제일별 카드 여신기간 안내"
        description: "카드 결제일별 일시불·할부 이용기간과 신용 제공기간, 결제일 변경에 따른 기간 기준을 문서에서 조회"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "결제일별 카드 이용기간을 알려줘"
          - "결제일에 따른 신용 제공기간을 알려줘"

  - code: "APARTMENT_MANAGEMENT_FEE_RP_ELIGIBILITY"
    name: "아파트 관리비 자동납부 연결 가능 단지 조회"
    description: "아파트명·단지명·주소로 실제 연결 가능 여부를 확인하거나 연결 가능 단지를 검색하는 데이터 조회. 실제 조회 목적이지만 검색값이 없으면 address=null로 분류하여 주소 입력 고정안내를 반환"
    details:
      - code: "APARTMENT_RP_LIST"
        name: "아파트 관리비 자동납부 연결 가능 단지 목록 조회"
        description: "아파트명·단지명·시·도·군·구·읍·면·동·로·길 주소로 실제 연결 가능 여부를 확인하거나 '아파트 자동이체 조회', '가능 단지 목록', '아파트를 찾아줘', '단지 검색'처럼 실제 데이터 조회를 요청하는 경우 선택. 검색값이 없으면 address=null"
        parameters:
          - "address"
        recommended_questions:
          - "래미안 원베일리는 관리비 자동납부가 가능해?"
          - "강남구 RP 연결 가능 아파트를 찾아줘"
          - "역삼동 관리비 자동납부 연결 가능 단지 목록을 보여줘"
        # address가 없을 때의 고정안내와 MCP 입력은
        # app/mcp/scenarios/rp.py의 apartment_rp_list()에서 제어한다.

  - code: "COMPOSITE_CONVERSION"
    name: "복합환산조회"
    description: "카드 모집인 본인의 복합판매 구분코드별 환산점수·실적 건수 또는 환산 미반영 내역을 기간계에서 조회. 신청 방법·처리 절차·기준 문서 질문에는 사용하지 않음"
    details:
      - code: "COMPOSITE_CONVERSION_SCORE"
        name: "복합판매 구분코드별 환산점수 및 실적 건수 조회"
        description: "질문에 환산점수·복합환산 점수·RP 실적·실적 건수·복합판매 구분별 실적 조회가 명시된 경우 카드 모집인 본인의 수치를 조회"
        parameters:
          - "closing_year_month"
          - "reference_date"
        recommended_questions:
          - "이번 달 RP 환산점수와 실적 건수를 보여줘"
          - "지난달 복합판매 구분별 환산점수를 조회해줘"
      - code: "COMPOSITE_CONVERSION_EXCLUDED"
        name: "환산 미반영 내역 조회"
        description: "질문에 미반영·실적 제외·반영되지 않은 이유·자동이체 미연결·자동차 연계·탈회·삼성전자 매출이 명시된 경우 환산 미반영 내역을 조회"
        parameters:
          - "closing_year_month"
        recommended_questions:
          - "복합환산에서 제외된 내역과 이유를 알려줘"
          - "지난달 환산 미반영 내역과 비교해줘"

  - code: "RP_FIXED_GUIDANCE"
    name: "고객 RP 업무 고정 안내"
    description: "고객 RP 접수 취소, 개별 연결·매출 확인, 발급 후 사후 신청을 문서나 MCP 없이 안내"
    details:
      - code: "RP_APPLICATION_CANCEL_GUIDANCE"
        name: "고객 RP 접수 취소 안내"
        description: "고객 자동납부 신청·접수·연결 취소 또는 삭제 요청과 해당 신청건 취소 가능 여부"
        parameters: []
      - code: "RP_CUSTOMER_PAYMENT_GUIDANCE"
        name: "고객 자동납부 내역 확인 제한"
        description: "특정 고객의 연결 카드사·은행·매출·납부·접수 상태 또는 개별 연결 가능 여부 확인"
        parameters: []
      - code: "RP_POST_ISSUANCE_APPLICATION_GUIDANCE"
        name: "RP 사후 신청 안내"
        description: "카드 발급 이후 RP 신청·연결 가능 여부와 방법, 고객 대신 자동납부 접수·신청 실행 요청"
        parameters: []
