<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>의도분류 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fa;
      --panel: #ffffff;
      --line: #dce2ea;
      --text: #182230;
      --muted: #667085;
      --primary: #175cd3;
      --primary-hover: #004eeb;
      --success: #067647;
      --success-bg: #ecfdf3;
      --warning: #b54708;
      --warning-bg: #fffaeb;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --code-bg: #101828;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 32px auto 64px;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -0.04em;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 4px 18px rgba(16, 24, 40, 0.05);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd6df;
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input,
    select {
      height: 44px;
      padding: 0 12px;
    }

    textarea {
      min-height: 132px;
      padding: 12px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 92, 211, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .primary {
      flex: 1;
      background: var(--primary);
      color: #fff;
    }

    .primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: #344054;
    }

    .danger {
      min-height: 34px;
      padding: 0 12px;
      background: var(--danger);
      color: #fff;
      font-size: 12px;
    }

    .conversation-manager {
      grid-column: 1 / -1;
    }

    .manager-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .manager-header h2 {
      margin: 0;
    }

    .conversation-list {
      display: grid;
      gap: 10px;
    }

    .conversation-row {
      display: grid;
      grid-template-columns: minmax(120px, 0.7fr) minmax(180px, 1.4fr)
        minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .conversation-row span {
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .approve {
      background: var(--success);
      color: #fff;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 0;
    }

    .chip {
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef4ff;
      color: #3538cd;
      font-size: 12px;
      font-weight: 700;
    }

    .result-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .status {
      display: inline-flex;
      margin-bottom: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .status.pass {
      background: var(--success-bg);
      color: var(--success);
    }

    .status.input-required {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status.exception,
    .status.error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    dl {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 10px 14px;
      margin: 0;
    }

    dt {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 650;
    }

    .hitl {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #fedf89;
      border-radius: 12px;
      background: var(--warning-bg);
    }

    .subagent {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #b2ddff;
      border-radius: 12px;
      background: #eff8ff;
    }

    .mcp-result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #abefc6;
      border-radius: 12px;
      background: #ecfdf3;
    }

    .mcp-result strong {
      display: block;
      margin-bottom: 10px;
      color: var(--success);
    }

    .subagent strong {
      display: block;
      margin-bottom: 12px;
      color: #175cd3;
    }

    .hitl strong {
      display: block;
      margin-bottom: 7px;
      color: var(--warning);
    }

    .hitl p {
      color: #7a2e0e;
    }

    .hitl .actions {
      margin-top: 14px;
    }

    details {
      margin-top: 18px;
    }

    summary {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    pre {
      max-height: 360px;
      margin: 10px 0 0;
      padding: 14px;
      overflow: auto;
      border-radius: 10px;
      background: var(--code-bg);
      color: #d0d5dd;
      font: 12px/1.55 Consolas, Monaco, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-message {
      color: var(--danger);
      line-height: 1.6;
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .conversation-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>의도분류 테스트</h1>
      <p>
        삼성카드 영업지점 AX 모집인 의도분류 테스트.
      </p>
      <div class="meta" id="metadata"></div>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>테스트 요청</h2>
        <form id="chat-form">
          <div class="row">
            <div class="field">
              <label for="employee-id">사원번호</label>
              <input id="employee-id" value="EMP001" required>
            </div>
            <div class="field">
              <label for="conversation-id">대화 ID</label>
              <input id="conversation-id" value="intent-test-001" required>
              <small>
                같은 값을 유지하면 이전 질문을 이어받습니다.
              </small>
            </div>
          </div>

          <div class="field">
            <label for="agent-code">프론트 선택 에이전트</label>
            <select id="agent-code">
              <option value="">에이전트 코드 불러오는 중...</option>
            </select>
            <small>
              멀티턴 이력은 같은 사원번호·대화 ID·에이전트 코드끼리만 연결됩니다.
            </small>
          </div>

          <div class="field">
            <label for="message">사용자 질문</label>
            <textarea
              id="message"
              placeholder="예: RP 상품의 가입 조건을 알려줘"
              required
            ></textarea>
          </div>

          <div class="actions">
            <button class="primary" id="submit-button" type="submit">
              의도분류 실행
            </button>
            <button class="secondary" id="reset-button" type="button">
              초기화
            </button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>분류 결과</h2>
        <div id="result">
          <div class="result-empty">
            왼쪽에 질문을 입력하고<br>의도분류 실행 버튼을 누르세요.
          </div>
        </div>
      </section>

      <section class="panel conversation-manager">
        <div class="manager-header">
          <div>
            <h2>프로젝트 전체 대화 관리</h2>
            <p id="conversation-summary">
              acqsc 프로젝트의 conversation_id를 조회합니다.
            </p>
          </div>
          <button class="secondary" id="refresh-conversations" type="button">
            목록 새로고침
          </button>
        </div>
        <div class="conversation-list" id="conversation-list">
          <div class="result-empty">대화 목록을 불러오는 중입니다.</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // 페이지를 FastAPI의 /tester에서 열면 같은 origin의 API를 호출하므로
    // 별도의 CORS 설정이나 API 주소 입력이 필요 없다.
    const form = document.querySelector("#chat-form");
    const employeeInput = document.querySelector("#employee-id");
    const conversationInput = document.querySelector("#conversation-id");
    const agentSelect = document.querySelector("#agent-code");
    const messageInput = document.querySelector("#message");
    const submitButton = document.querySelector("#submit-button");
    const resetButton = document.querySelector("#reset-button");
    const resultBox = document.querySelector("#result");
    const metadataBox = document.querySelector("#metadata");
    const conversationList = document.querySelector("#conversation-list");
    const conversationSummary = document.querySelector("#conversation-summary");
    const refreshConversationsButton =
      document.querySelector("#refresh-conversations");

    let waitingThreadId = null;
    let lastResponse = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatJson(value) {
      return escapeHtml(JSON.stringify(value, null, 2));
    }

    function setLoading(isLoading, label = "처리 중...") {
      submitButton.disabled = isLoading;
      resetButton.disabled = isLoading;
      submitButton.textContent = isLoading ? label : "의도분류 실행";
    }

    async function requestJson(path, body, method) {
      const options = {
        headers: { "Content-Type": "application/json" },
      };
      if (method) {
        options.method = method;
      }
      if (body !== undefined) {
        options.method = method ?? "POST";
        options.body = JSON.stringify(body);
      }

      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) {
        const error = new Error(`HTTP ${response.status}`);
        error.status = response.status;
        error.payload = data;
        throw error;
      }
      return data;
    }

    async function loadMetadata() {
      try {
        const metadata = await requestJson("/v1/metadata");
        agentSelect.innerHTML = [
          '<option value="">선택하지 않음 (LLM 분류로 바로 진행)</option>',
          ...metadata.agent_codes.map(
            (code) => `<option value="${escapeHtml(code)}">${escapeHtml(code)}</option>`,
          ),
        ].join("");
        metadataBox.innerHTML = [
          `프롬프트 ${metadata.prompt_version}`,
          `이력 ${metadata.chat_history_store}`,
          `HITL ${metadata.hitl_state_store}`,
          `MCP ${metadata.mcp_backend}`,
          `서브에이전트 ${
            metadata.subagent_codes.length
              ? metadata.subagent_codes.join(", ")
              : "없음"
          }`,
        ]
          .map((text) => `<span class="chip">${escapeHtml(text)}</span>`)
          .join("");
        await loadConversationList();
      } catch (error) {
        agentSelect.innerHTML = '<option value="">메타데이터 조회 실패</option>';
        renderError(error);
      }
    }

    async function loadConversationList() {
      conversationList.innerHTML =
        '<div class="result-empty">대화 목록을 불러오는 중입니다.</div>';
      try {
        const data = await requestJson("/v1/tester/conversations");
        conversationSummary.textContent =
          `${data.project_code} 프로젝트 · ${data.backend} 저장소 · ` +
          `${data.count}개 대화`;
        if (!data.conversations.length) {
          conversationList.innerHTML =
            '<div class="result-empty">저장된 대화가 없습니다.</div>';
          return;
        }

        conversationList.innerHTML = data.conversations
          .map((conversation) => {
            const agentCounts = Object.entries(conversation.agent_counts ?? {})
              .map(([code, count]) => `${code}: ${count}`)
              .join(", ");
            return `
              <div class="conversation-row">
                <span><strong>${escapeHtml(conversation.employee_id)}</strong></span>
                <span>${escapeHtml(conversation.conversation_id)}</span>
                <span>
                  ${escapeHtml(agentCounts || "-")}
                  · 총 ${escapeHtml(conversation.message_count)}건
                </span>
                <button
                  class="danger delete-conversation"
                  type="button"
                  data-employee-id="${escapeHtml(conversation.employee_id)}"
                  data-conversation-id="${escapeHtml(conversation.conversation_id)}"
                >
                  삭제
                </button>
              </div>
            `;
          })
          .join("");

        document.querySelectorAll(".delete-conversation").forEach((button) => {
          button.addEventListener("click", () => deleteConversation(button));
        });
      } catch (error) {
        conversationList.innerHTML = `
          <p class="error-message">전체 대화 목록 조회에 실패했습니다.</p>
          <pre>${formatJson(error.payload ?? { message: error.message })}</pre>
        `;
      }
    }

    async function deleteConversation(button) {
      const employeeId = button.dataset.employeeId;
      const conversationId = button.dataset.conversationId;
      const confirmed = window.confirm(
        `${employeeId} 사원의 대화 '${conversationId}'에 속한 ` +
        "모든 에이전트 이력을 삭제하시겠습니까?",
      );
      if (!confirmed) {
        return;
      }

      button.disabled = true;
      button.textContent = "삭제 중...";
      const parameters = new URLSearchParams({
        employee_id: employeeId,
        conversation_id: conversationId,
      });
      try {
        const result = await requestJson(
          `/v1/tester/conversations?${parameters.toString()}`,
          undefined,
          "DELETE",
        );
        if (
          employeeInput.value.trim() === employeeId
          && conversationInput.value.trim() === conversationId
        ) {
          resultBox.innerHTML = `
            <div class="result-empty">
              현재 대화의 이력
              ${escapeHtml(result.deleted_message_count)}건을 삭제했습니다.
            </div>
          `;
        }
        await loadConversationList();
      } catch (error) {
        button.disabled = false;
        button.textContent = "삭제";
        window.alert(`대화 삭제에 실패했습니다: ${error.message}`);
      }
    }

    function renderResult(data) {
      lastResponse = data;
      waitingThreadId =
        data.status === "INPUT_REQUIRED" ? data.thread_id : null;

      const classification = data.classification ?? {};
      const subagent = data.subagent;
      const mcp = data.mcp;
      const statusClass = String(data.status)
        .toLowerCase()
        .replaceAll("_", "-");
      const hitl = data.interrupt;

      let html = `
        <span class="status ${escapeHtml(statusClass)}">
          ${escapeHtml(data.status)}
        </span>
        <dl>
          <dt>분류 유형</dt>
          <dd>${escapeHtml(classification.classification_type)}</dd>
          <dt>분류 에이전트</dt>
          <dd>${escapeHtml(classification.agent_code ?? "-")}</dd>
          <dt>보정 질문</dt>
          <dd>${escapeHtml(classification.refined_query)}</dd>
          <dt>Thread ID</dt>
          <dd>${escapeHtml(data.thread_id)}</dd>
          <dt>Conversation ID</dt>
          <dd>${escapeHtml(conversationInput.value.trim())}</dd>
        </dl>
      `;

      if (subagent) {
        const parameterRows = Object.entries(subagent.parameters ?? {})
          .map(
            ([name, value]) => `
              <dt>${escapeHtml(name)}</dt>
              <dd>${escapeHtml(value ?? "null")}</dd>
            `,
          )
          .join("");
        html += `
          <div class="subagent">
            <strong>${escapeHtml(subagent.agent_code)} 서브에이전트 결과</strong>
            <dl>
              <dt>시나리오</dt>
              <dd>
                ${escapeHtml(subagent.scenario_name)}
                (${escapeHtml(subagent.scenario_code)})
              </dd>
              <dt>세부 시나리오</dt>
              <dd>
                ${escapeHtml(subagent.detail_scenario_name)}
                (${escapeHtml(subagent.detail_scenario_code)})
              </dd>
              <dt>프롬프트 버전</dt>
              <dd>${escapeHtml(subagent.prompt_version)}</dd>
              ${parameterRows}
            </dl>
          </div>
        `;
      }

      if (mcp) {
        html += `
          <div class="mcp-result">
            <strong>MCP 도구 호출 결과</strong>
            <dl>
              <dt>사용 도구</dt>
              <dd>${escapeHtml(mcp.tool_name)}</dd>
              <dt>추적 ID</dt>
              <dd>${escapeHtml(mcp.request_id)}</dd>
              <dt>백엔드</dt>
              <dd>${escapeHtml(mcp.backend)}</dd>
              <dt>성공 여부</dt>
              <dd>${escapeHtml(mcp.succeeded)}</dd>
            </dl>
            <details>
              <summary>MCP Payload와 structuredContent 원본 보기</summary>
              <pre>${formatJson({
                tool_name: mcp.tool_name,
                request_id: mcp.request_id,
                arguments: mcp.arguments,
                result: mcp.result,
                error: mcp.error,
              })}</pre>
            </details>
          </div>
        `;
      }

      if (hitl) {
        const context = hitl.context ?? {};
        const errors = hitl.errors ?? {};
        html += `
          <div class="hitl">
            <strong>${escapeHtml(hitl.type)}</strong>
            <p>${escapeHtml(hitl.message)}</p>
            <dl style="margin-top: 12px">
              <dt>프론트 선택</dt>
              <dd>${escapeHtml(context.frontend_agent_code ?? "-")}</dd>
              <dt>LLM 분류</dt>
              <dd>${escapeHtml(context.classified_agent_code ?? "-")}</dd>
            </dl>
            ${
              Object.keys(errors).length
                ? `<p class="error-message" style="margin-top: 10px">
                    ${escapeHtml(Object.values(errors).join(", "))}
                  </p>`
                : ""
            }
            <div class="actions">
              <button class="approve" id="approve-button" type="button">
                LLM 분류 에이전트로 변경 승인
              </button>
            </div>
          </div>
        `;
      }

      html += `
        <details id="history-details">
          <summary>대화내역 보기</summary>
          <div id="history-content">
            펼치면 현재 사원번호·대화 ID·분류 에이전트의 이력을 조회합니다.
          </div>
        </details>
        <details>
          <summary>전체 JSON 보기</summary>
          <pre>${formatJson(data)}</pre>
        </details>
      `;
      resultBox.innerHTML = html;

      const approveButton = document.querySelector("#approve-button");
      if (approveButton) {
        approveButton.addEventListener("click", approveHitl);
      }

      const historyDetails = document.querySelector("#history-details");
      if (historyDetails) {
        historyDetails.addEventListener("toggle", () => {
          if (historyDetails.open) {
            loadConversationHistory(classification.agent_code);
          }
        });
      }
    }

    async function loadConversationHistory(classifiedAgentCode) {
      const historyContent = document.querySelector("#history-content");
      if (!historyContent) {
        return;
      }

      // 프론트 미선택 또는 HITL 변경 후에도 실제 저장 범위인 마스터 분류
      // agent_code를 사용한다. 따라서 다른 에이전트의 이력을 섞어 조회하지 않는다.
      if (!classifiedAgentCode) {
        historyContent.innerHTML =
          '<p class="error-message">조회할 분류 에이전트가 없습니다.</p>';
        return;
      }

      const parameters = new URLSearchParams({
        employee_id: employeeInput.value.trim(),
        conversation_id: conversationInput.value.trim(),
        agent_code: classifiedAgentCode,
      });
      historyContent.innerHTML = "<p>대화이력을 조회하는 중입니다...</p>";

      try {
        const history = await requestJson(
          `/v1/tester/history?${parameters.toString()}`,
        );
        if (!history.messages.length) {
          historyContent.innerHTML = `
            <p>저장된 대화이력이 없습니다.</p>
            <pre>${formatJson(history)}</pre>
          `;
          return;
        }

        const rows = history.messages
          .map(
            (message, index) => `
              <dt>${index + 1}. ${escapeHtml(message.role)}</dt>
              <dd>${escapeHtml(message.content)}</dd>
            `,
          )
          .join("");
        historyContent.innerHTML = `
          <dl>${rows}</dl>
          <details>
            <summary>대화이력 JSON 보기</summary>
            <pre>${formatJson(history)}</pre>
          </details>
        `;
      } catch (error) {
        const payload = error.payload ?? { message: error.message };
        historyContent.innerHTML = `
          <p class="error-message">대화이력 조회에 실패했습니다.</p>
          <pre>${formatJson(payload)}</pre>
        `;
      }
    }

    function renderError(error) {
      const payload = error.payload ?? { message: error.message };
      resultBox.innerHTML = `
        <span class="status error">ERROR</span>
        <p class="error-message">
          요청 처리에 실패했습니다: ${escapeHtml(error.message)}
        </p>
        <details open>
          <summary>오류 JSON</summary>
          <pre>${formatJson(payload)}</pre>
        </details>
      `;
    }

    async function submitQuestion(event) {
      event.preventDefault();
      waitingThreadId = null;
      setLoading(true, "LLM 분류 중...");
      resultBox.innerHTML = '<div class="result-empty">의도분류 처리 중...</div>';

      const request = {
        message: messageInput.value.trim(),
        employee_id: employeeInput.value.trim(),
        conversation_id: conversationInput.value.trim(),
      };
      // 선택하지 않은 경우 필드 자체를 보내지 않는다. API는 null과 빈 문자열도
      // 같은 의미로 처리하지만, 목업에서는 가장 명확한 생략 형태를 사용한다.
      if (agentSelect.value) {
        request.frontend_agent_code = agentSelect.value;
      }

      try {
        const data = await requestJson("/v1/chat", request);
        renderResult(data);
        await loadConversationList();
      } catch (error) {
        renderError(error);
      } finally {
        setLoading(false);
      }
    }

    async function approveHitl() {
      if (!waitingThreadId) {
        return;
      }

      const approveButton = document.querySelector("#approve-button");
      approveButton.disabled = true;
      approveButton.textContent = "승인 처리 중...";

      try {
        const data = await requestJson("/v1/chat", {
          thread_id: waitingThreadId,
          hitl_input: { signal: "OK" },
        });
        renderResult(data);
        await loadConversationList();
      } catch (error) {
        renderError(error);
      }
    }

    function resetForm() {
      waitingThreadId = null;
      lastResponse = null;
      messageInput.value = "";
      resultBox.innerHTML = `
        <div class="result-empty">
          결과 화면만 지웠습니다.<br>
          대화 ID를 유지하면 다음 질문도 같은 멀티턴으로 이어집니다.
        </div>
      `;
      messageInput.focus();
    }

    form.addEventListener("submit", submitQuestion);
    resetButton.addEventListener("click", resetForm);
    refreshConversationsButton.addEventListener(
      "click",
      loadConversationList,
    );
    loadMetadata();
  </script>
</body>
</html>
